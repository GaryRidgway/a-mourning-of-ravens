<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>A Mourning of Ravens</title>

  <!-- Fonts. -->
  <style>
    @font-face {
        font-family: "Cinzel";
        src: url("./src/fonts/Cinzel/Cinzel-VariableFont_wght.ttf");
    }
    </style>

  <!-- Add css files fromt the dist folder here -->
  <link type="text/css" rel="stylesheet" href="./dist/css/poem.css">
  <link type="text/css" rel="stylesheet" href="./dist/css/scroll.css">
  <link type="text/css" rel="stylesheet" href="./dist/css/reset.css">
</head>

<body>
  <div id="poem-bg"></div>
  <div id="flow-box-overlay" aria-hidden="true"></div>
  <div id="poem-staging"></div>
  <div id="poem-container"></div>
    <aside id="dune-controls" class="controls">
      <details class="control-panel" open>
      <summary>Dune Controls</summary>

      <details class="control-group" open>
        <summary>Particles</summary>

        <label class="control-row">
          <span>Particle Radius</span>
          <input type="range" min="0.2" max="3" step="0.05" data-key="particleSize" />
          <output data-value-for="particleSize"></output>
        </label>

        <label class="control-row">
          <span>Size Rand Negative</span>
          <input type="range" min="0" max="2" step="0.01" data-key="particleSizeRandomNegative" />
          <output data-value-for="particleSizeRandomNegative"></output>
        </label>

        <label class="control-row">
          <span>Size Rand Positive</span>
          <input type="range" min="0" max="2" step="0.01" data-key="particleSizeRandomPositive" />
          <output data-value-for="particleSizeRandomPositive"></output>
        </label>

        <label class="control-row">
          <span>Box Collision Fraction</span>
          <input type="range" min="0" max="1" step="0.01" data-key="boxCollisionParticipantRatio" />
          <output data-value-for="boxCollisionParticipantRatio"></output>
        </label>

        <label class="control-row">
          <span>Min Speed To Draw</span>
          <input type="range" min="0" max="3" step="0.01" data-key="particleRenderMinSpeed" />
          <output data-value-for="particleRenderMinSpeed"></output>
        </label>

        <label class="control-row">
          <span>Speed Alpha Boost</span>
          <input type="range" min="0" max="8" step="0.01" data-key="particleSpeedAlphaBoost" />
          <output data-value-for="particleSpeedAlphaBoost"></output>
        </label>

        <label class="control-row">
          <span>Dune Alpha Boost</span>
          <input type="range" min="0" max="12" step="0.01" data-key="particleDuneAlphaBoost" />
          <output data-value-for="particleDuneAlphaBoost"></output>
        </label>

        <label class="control-row">
          <span>Dune Size Boost</span>
          <input type="range" min="0" max="8" step="0.01" data-key="particleDuneSizeBoost" />
          <output data-value-for="particleDuneSizeBoost"></output>
        </label>

        <label class="control-row">
          <span>Speed Width Boost</span>
          <input type="range" min="0" max="4" step="0.01" data-key="particleSpeedWidthBoost" />
          <output data-value-for="particleSpeedWidthBoost"></output>
        </label>

        <label class="control-row">
          <span>Render Fraction</span>
          <input type="range" min="0.05" max="1" step="0.01" data-key="particleRenderFraction" />
          <output data-value-for="particleRenderFraction"></output>
        </label>

        <label class="control-row">
          <span>Max Particles</span>
          <input type="range" min="200" max="10000" step="100" data-key="particleCount" />
          <output data-value-for="particleCount"></output>
        </label>

      </details>

      <details class="control-group" open>
        <summary>Hillshade</summary>

        <label class="control-row">
          <span>Sun Angle</span>
          <input type="range" min="-180" max="180" step="1" data-key="hillshadeSunAngleDeg" />
          <output data-value-for="hillshadeSunAngleDeg"></output>
        </label>

        <label class="control-row">
          <span>Sun Elevation</span>
          <input type="range" min="1" max="89" step="1" data-key="hillshadeSunElevationDeg" />
          <output data-value-for="hillshadeSunElevationDeg"></output>
        </label>

        <label class="control-row">
          <span>Ambient</span>
          <input type="range" min="0" max="1" step="0.01" data-key="hillshadeAmbient" />
          <output data-value-for="hillshadeAmbient"></output>
        </label>

        <label class="control-row">
          <span>Normal Strength</span>
          <input type="range" min="0.5" max="30" step="0.5" data-key="hillshadeNormalStrength" />
          <output data-value-for="hillshadeNormalStrength"></output>
        </label>

        <label class="control-row">
          <span>Resolution Divisor</span>
          <input type="range" min="1" max="12" step="1" data-key="hillshadeResolutionDivisor" />
          <output data-value-for="hillshadeResolutionDivisor"></output>
        </label>

        <label class="control-row control-toggle">
          <span>Poly Shade</span>
          <input type="checkbox" data-key="usePolyShade" />
        </label>

        <label class="control-row">
          <span>Grid Columns</span>
          <input type="range" min="4" max="120" step="1" data-key="polyGridCols" />
          <output data-value-for="polyGridCols"></output>
        </label>

        <label class="control-row">
          <span>Grid Rows</span>
          <input type="range" min="4" max="80" step="1" data-key="polyGridRows" />
          <output data-value-for="polyGridRows"></output>
        </label>

        <label class="control-row">
          <span>Vertex Jitter</span>
          <input type="range" min="0" max="1" step="0.01" data-key="polyJitter" />
          <output data-value-for="polyJitter"></output>
        </label>

        <label class="control-row">
          <span>Edge Alpha</span>
          <input type="range" min="0" max="255" step="1" data-key="polyEdgeAlpha" />
          <output data-value-for="polyEdgeAlpha"></output>
        </label>

        <label class="control-row">
          <span>Slope Contrast</span>
          <input type="range" min="0.1" max="40" step="0.1" data-key="polySlopeContrast" />
          <output data-value-for="polySlopeContrast"></output>
        </label>

      </details>

      <details class="control-group">
        <summary>Boosted Particles</summary>

        <label class="control-row">
          <span>Boosted Fraction</span>
          <input type="range" min="0" max="0.2" step="0.001" data-key="windBoostParticleRatio" />
          <output data-value-for="windBoostParticleRatio"></output>
        </label>

        <label class="control-row">
          <span>Boosted Size</span>
          <input type="range" min="0.1" max="2.0" step="0.01" data-key="windBoostSizeMultiplier" />
          <output data-value-for="windBoostSizeMultiplier"></output>
        </label>

        <label class="control-row">
          <span>Boosted Alpha</span>
          <input type="range" min="0" max="255" step="1" data-key="windBoostAlphaMultiplier" />
          <output data-value-for="windBoostAlphaMultiplier"></output>
        </label>

        <label class="control-row">
          <span>Boosted Lightness</span>
          <input type="range" min="-1.0" max="1.0" step="0.01" data-key="windBoostLightnessShift" />
          <output data-value-for="windBoostLightnessShift"></output>
        </label>

        <label class="control-row">
          <span>Boosted Wind Min</span>
          <input type="range" min="1" max="20" step="0.1" data-key="windBoostMinMultiplier" />
          <output data-value-for="windBoostMinMultiplier"></output>
        </label>

        <label class="control-row">
          <span>Boosted Wind Max</span>
          <input type="range" min="1" max="30" step="0.1" data-key="windBoostMaxMultiplier" />
          <output data-value-for="windBoostMaxMultiplier"></output>
        </label>

        <label class="control-row">
          <span>Boosted Turbulence Min</span>
          <input type="range" min="1" max="20" step="0.1" data-key="windBoostTurbulenceMinMultiplier" />
          <output data-value-for="windBoostTurbulenceMinMultiplier"></output>
        </label>

        <label class="control-row">
          <span>Boosted Turbulence Max</span>
          <input type="range" min="1" max="30" step="0.1" data-key="windBoostTurbulenceMaxMultiplier" />
          <output data-value-for="windBoostTurbulenceMaxMultiplier"></output>
        </label>
      </details>

      <details class="control-group">
        <summary>Boid Flocking</summary>

        <label class="control-row control-toggle">
          <span>Enable Flocking</span>
          <input type="checkbox" data-key="enableBoidFlocking" />
        </label>

        <label class="control-row">
          <span>Neighbor Radius</span>
          <input type="range" min="10" max="200" step="1" data-key="boidNeighborRadius" />
          <output data-value-for="boidNeighborRadius"></output>
        </label>

        <label class="control-row">
          <span>Separation Radius</span>
          <input type="range" min="2" max="100" step="1" data-key="boidSeparationRadius" />
          <output data-value-for="boidSeparationRadius"></output>
        </label>

        <label class="control-row">
          <span>Separation Strength</span>
          <input type="range" min="0" max="5" step="0.01" data-key="boidSeparationStrength" />
          <output data-value-for="boidSeparationStrength"></output>
        </label>

        <label class="control-row">
          <span>Alignment Strength</span>
          <input type="range" min="0" max="5" step="0.01" data-key="boidAlignmentStrength" />
          <output data-value-for="boidAlignmentStrength"></output>
        </label>

        <label class="control-row">
          <span>Cohesion Strength</span>
          <input type="range" min="0" max="5" step="0.01" data-key="boidCohesionStrength" />
          <output data-value-for="boidCohesionStrength"></output>
        </label>

        <label class="control-row">
          <span>Max Steer Force</span>
          <input type="range" min="0.001" max="1" step="0.001" data-key="boidMaxSteerForce" />
          <output data-value-for="boidMaxSteerForce"></output>
        </label>

        <label class="control-row">
          <span>Wind Blend</span>
          <input type="range" min="0" max="1" step="0.01" data-key="boidWindBlend" />
          <output data-value-for="boidWindBlend"></output>
        </label>

        <label class="control-row">
          <span>Max Group Size</span>
          <input type="range" min="1" max="30" step="1" data-key="boidMaxGroupSize" />
          <output data-value-for="boidMaxGroupSize"></output>
        </label>

        <label class="control-row">
          <span>Dispersal Strength</span>
          <input type="range" min="0" max="5" step="0.01" data-key="boidDispersalStrength" />
          <output data-value-for="boidDispersalStrength"></output>
        </label>
      </details>

      <details class="control-group" open>
        <summary>Performance</summary>

        <label class="control-row control-toggle">
          <span>Enable Adaptive Quality</span>
          <input type="checkbox" data-key="enableAdaptiveQuality" />
        </label>

        <label class="control-row control-toggle">
          <span>Lock Quality Tier</span>
          <input type="checkbox" data-key="lockQualityTier" />
        </label>

        <label class="control-row">
          <span>Target FPS</span>
          <input type="range" min="20" max="120" step="1" data-key="qualityTargetFps" />
          <output data-value-for="qualityTargetFps"></output>
        </label>

        <label class="control-row control-toggle">
          <span>Auto Render Scale</span>
          <input type="checkbox" data-key="enableAutoRenderScale" />
        </label>

        <label class="control-row">
          <span>Auto Scale Threshold (px)</span>
          <input type="range" min="640" max="3200" step="10" data-key="autoRenderScaleThresholdPx" />
          <output data-value-for="autoRenderScaleThresholdPx"></output>
        </label>

        <label class="control-row">
          <span>Decision Window (ms)</span>
          <input type="range" min="200" max="3000" step="50" data-key="qualityDecisionWindowMs" />
          <output data-value-for="qualityDecisionWindowMs"></output>
        </label>

        <label class="control-row">
          <span>Tier Cooldown (ms)</span>
          <input type="range" min="200" max="3000" step="50" data-key="qualityCooldownMs" />
          <output data-value-for="qualityCooldownMs"></output>
        </label>

        <label class="control-row">
          <span>Quality Transition (ms)</span>
          <input type="range" min="80" max="2000" step="20" data-key="qualityTransitionMs" />
          <output data-value-for="qualityTransitionMs"></output>
        </label>

        <label class="control-row control-toggle">
          <span>Show Performance HUD</span>
          <input type="checkbox" data-key="qualityHudEnabled" />
        </label>

      </details>

      <details class="control-group" open>
        <summary>Ambient Motion</summary>

        <label class="control-row control-toggle">
          <span>Enable Ambient Motion</span>
          <input type="checkbox" data-key="enableAmbientMotion" />
        </label>

        <label class="control-row control-toggle">
          <span>Enable Dunes</span>
          <input type="checkbox" data-key="enableDuneBands" />
        </label>

        <label class="control-row control-angle-row">
          <span>Wind Direction</span>
          <input class="control-angle-input" type="range" min="-180" max="180" step="1" data-key="ambientWindDirectionDeg" />
          <button class="control-angle" type="button" data-angle-key="ambientWindDirectionDeg" aria-label="Wind direction"></button>
          <output data-value-for="ambientWindDirectionDeg"></output>
        </label>

        <label class="control-row">
          <span>Wind Strength</span>
          <input type="range" min="0" max="0.5" step="0.001" data-key="ambientWindStrength" />
          <output data-value-for="ambientWindStrength"></output>
        </label>

        <label class="control-row">
          <span>Micro Noise Scale</span>
          <input type="range" min="40" max="1000" step="1" data-key="microNoiseScale" />
          <output data-value-for="microNoiseScale"></output>
        </label>

        <label class="control-row">
          <span>Micro Turbulence</span>
          <input type="range" min="0" max="0.1" step="0.001" data-key="microTurbulenceStrength" />
          <output data-value-for="microTurbulenceStrength"></output>
        </label>

      </details>

      <details class="control-group" open>
        <summary>Dunes</summary>

        <label class="control-row control-angle-row">
          <span>Dune Band Angle</span>
          <input class="control-angle-input" type="range" min="-180" max="180" step="1" data-key="duneBandRotationDeg" />
          <button class="control-angle" type="button" data-angle-key="duneBandRotationDeg" aria-label="Dune band angle"></button>
          <output data-value-for="duneBandRotationDeg"></output>
        </label>

        <label class="control-row">
          <span>Dune Band Scale</span>
          <input type="range" min="40" max="600" step="1" data-key="duneBandScale" />
          <output data-value-for="duneBandScale"></output>
        </label>

        <label class="control-row">
          <span>Dune Band Offset</span>
          <input type="range" min="-600" max="600" step="1" data-key="duneBandOffsetPx" />
          <output data-value-for="duneBandOffsetPx"></output>
        </label>

        <label class="control-row">
          <span>Dune Along Warp Scale</span>
          <input type="range" min="80" max="900" step="1" data-key="duneAlongWarpScale" />
          <output data-value-for="duneAlongWarpScale"></output>
        </label>

        <label class="control-row">
          <span>Dune Warp Strength</span>
          <input type="range" min="0" max="4" step="0.01" data-key="duneWarpStrength" />
          <output data-value-for="duneWarpStrength"></output>
        </label>

        <label class="control-row">
          <span>Dune Contrast</span>
          <input type="range" min="0.2" max="4" step="0.01" data-key="duneContrast" />
          <output data-value-for="duneContrast"></output>
        </label>

        <label class="control-row">
          <span>Dune Drift Speed</span>
          <input type="range" min="0" max="1.2" step="0.01" data-key="duneDriftSpeed" />
          <output data-value-for="duneDriftSpeed"></output>
        </label>

        <label class="control-row">
          <span>Edge Respawn Base</span>
          <input type="range" min="0" max="0.5" step="0.01" data-key="edgeRespawnWeightBase" />
          <output data-value-for="edgeRespawnWeightBase"></output>
        </label>

        <label class="control-row">
          <span>Edge Respawn Strength</span>
          <input type="range" min="0" max="3" step="0.05" data-key="edgeRespawnWeightStrength" />
          <output data-value-for="edgeRespawnWeightStrength"></output>
        </label>

        <label class="control-row">
          <span>Edge Respawn Exponent</span>
          <input type="range" min="0.5" max="4" step="0.1" data-key="edgeRespawnWeightExponent" />
          <output data-value-for="edgeRespawnWeightExponent"></output>
        </label>

        <label class="control-row control-toggle">
          <span>Weighted Edge Respawn</span>
          <input type="checkbox" data-key="useWeightedEdgeRespawn" />
        </label>

        <label class="control-row">
          <span>Weighted Mix When Off (%)</span>
          <input type="range" min="0" max="100" step="1" data-key="edgeRespawnWeightedMixPercent" />
          <output data-value-for="edgeRespawnWeightedMixPercent"></output>
        </label>

      </details>

      <details class="control-group">
        <summary>Collision Separation</summary>

        <label class="control-row control-toggle">
          <span>Enable Separation</span>
          <input type="checkbox" data-key="enableParticleSeparation" />
        </label>

        <label class="control-row">
          <span>Collision Radius</span>
          <input type="range" min="0.4" max="3" step="0.05" data-key="particleCollisionRadius" />
          <output data-value-for="particleCollisionRadius"></output>
        </label>

        <label class="control-row">
          <span>Collision Strength</span>
          <input type="range" min="0" max="1.5" step="0.01" data-key="particleCollisionStrength" />
          <output data-value-for="particleCollisionStrength"></output>
        </label>

        <label class="control-row">
          <span>Velocity Damp</span>
          <input type="range" min="0" max="0.5" step="0.01" data-key="particleCollisionVelocityDamp" />
          <output data-value-for="particleCollisionVelocityDamp"></output>
        </label>

        <label class="control-row">
          <span>Frames Per Solve</span>
          <input type="range" min="1" max="6" step="1" data-key="separationEveryNFrames" />
          <output data-value-for="separationEveryNFrames"></output>
        </label>

        <label class="control-row">
          <span>Near Box Radius</span>
          <input type="range" min="1" max="100" step="1" data-key="separationNearBoxRadius" />
          <output data-value-for="separationNearBoxRadius"></output>
        </label>

        <label class="control-row">
          <span>Min Active Speed</span>
          <input type="range" min="0" max="1" step="0.01" data-key="separationMinSpeed" />
          <output data-value-for="separationMinSpeed"></output>
        </label>

        <label class="control-row">
          <span>Box Force Max Radius</span>
          <input type="range" min="0.5" max="20" step="0.1" data-key="boxForceMaxRadius" />
          <output data-value-for="boxForceMaxRadius"></output>
        </label>

        <label class="control-row">
          <span>Surface Slide Band</span>
          <input type="range" min="0.2" max="4" step="0.05" data-key="surfaceSlideBand" />
          <output data-value-for="surfaceSlideBand"></output>
        </label>

        <label class="control-row">
          <span>Forward Dot Min</span>
          <input type="range" min="0" max="0.5" step="0.01" data-key="staticInfluenceForwardDotMin" />
          <output data-value-for="staticInfluenceForwardDotMin"></output>
        </label>

        <label class="control-row">
          <span>Backside Drag</span>
          <input type="range" min="0" max="1" step="0.01" data-key="backsideDragStrength" />
          <output data-value-for="backsideDragStrength"></output>
        </label>
      </details>

      <details class="control-group">
        <summary>Render Colors</summary>

        <label class="control-row">
          <span>Background Fade</span>
          <input type="color" data-color-key="fade" />
          <output data-color-value-for="fade"></output>
        </label>
        <label class="control-row">
          <span>Background Fade Alpha</span>
          <input type="range" min="0" max="255" step="1" data-color-alpha-key="fade" />
          <output data-color-alpha-value-for="fade"></output>
        </label>
        <label class="control-row">
          <span>Background Fade Alpha B</span>
          <input type="range" min="0" max="255" step="1" data-color-alpha-key="fadeSecondary" />
          <output data-color-alpha-value-for="fadeSecondary"></output>
        </label>
        <label class="control-row">
          <span>Oscillation Period (s)</span>
          <input type="range" min="0" max="30" step="0.1" data-key="backgroundFadeOscillationPeriodSec" />
          <output data-value-for="backgroundFadeOscillationPeriodSec"></output>
        </label>

        <label class="control-row">
          <span>Particles</span>
          <input type="color" data-color-key="particles" />
          <output data-color-value-for="particles"></output>
        </label>
        <label class="control-row">
          <span>Particles Alpha</span>
          <input type="range" min="0" max="255" step="1" data-color-alpha-key="particles" />
          <output data-color-alpha-value-for="particles"></output>
        </label>
        <label class="control-row">
          <span>Particles Alpha B</span>
          <input type="range" min="0" max="255" step="1" data-color-alpha-key="particlesSecondary" />
          <output data-color-alpha-value-for="particlesSecondary"></output>
        </label>

        <label class="control-row">
          <span>Separation Zone</span>
          <input type="color" data-color-key="separationZone" />
          <output data-color-value-for="separationZone"></output>
        </label>
        <label class="control-row">
          <span>Separation Zone Alpha</span>
          <input type="range" min="0" max="255" step="1" data-color-alpha-key="separationZone" />
          <output data-color-alpha-value-for="separationZone"></output>
        </label>

        <label class="control-row">
          <span>Box Stroke (Idle)</span>
          <input type="color" data-color-key="boxStrokeIdle" />
          <output data-color-value-for="boxStrokeIdle"></output>
        </label>
        <label class="control-row">
          <span>Box Stroke (Idle) Alpha</span>
          <input type="range" min="0" max="255" step="1" data-color-alpha-key="boxStrokeIdle" />
          <output data-color-alpha-value-for="boxStrokeIdle"></output>
        </label>

        <label class="control-row">
          <span>Box Stroke (Dragged)</span>
          <input type="color" data-color-key="boxStrokeDragged" />
          <output data-color-value-for="boxStrokeDragged"></output>
        </label>
        <label class="control-row">
          <span>Box Stroke (Dragged) Alpha</span>
          <input type="range" min="0" max="255" step="1" data-color-alpha-key="boxStrokeDragged" />
          <output data-color-alpha-value-for="boxStrokeDragged"></output>
        </label>

      </details>

      <details class="control-group">
        <summary>Box Glow</summary>

        <label class="control-row control-toggle">
          <span>Enable Glow</span>
          <input type="checkbox" data-key="enableBoxGlow" />
        </label>

        <label class="control-row">
          <span>Glow Proximity</span>
          <input type="range" min="1" max="60" step="1" data-key="boxGlowRadius" />
          <output data-value-for="boxGlowRadius"></output>
        </label>

        <label class="control-row">
          <span>Core Diameter</span>
          <input type="range" min="0.5" max="12" step="0.1" data-key="boxGlowCoreDiameter" />
          <output data-value-for="boxGlowCoreDiameter"></output>
        </label>

        <label class="control-row">
          <span>Halo Size</span>
          <input type="range" min="1" max="10" step="0.1" data-key="boxGlowHaloSize" />
          <output data-value-for="boxGlowHaloSize"></output>
        </label>

        <label class="control-row">
          <span>Halo Alpha</span>
          <input type="range" min="0" max="255" step="1" data-key="boxGlowHaloAlpha" />
          <output data-value-for="boxGlowHaloAlpha"></output>
        </label>

        <label class="control-row">
          <span>Core Blend</span>
          <input type="range" min="0" max="1" step="0.01" data-key="boxGlowCoreWhite" />
          <output data-value-for="boxGlowCoreWhite"></output>
        </label>

        <label class="control-row">
          <span>Core Color</span>
          <input type="color" data-color-key="boxGlowCore" />
          <output data-color-value-for="boxGlowCore"></output>
        </label>
        <label class="control-row">
          <span>Core Color Alpha</span>
          <input type="range" min="0" max="255" step="1" data-color-alpha-key="boxGlowCore" />
          <output data-color-alpha-value-for="boxGlowCore"></output>
        </label>

        <label class="control-row">
          <span>Fade Delay (ms)</span>
          <input type="range" min="0" max="2000" step="10" data-key="boxGlowFadeDelayMs" />
          <output data-value-for="boxGlowFadeDelayMs"></output>
        </label>

        <label class="control-row">
          <span>Fade Duration (ms)</span>
          <input type="range" min="0" max="3000" step="10" data-key="boxGlowFadeDurationMs" />
          <output data-value-for="boxGlowFadeDurationMs"></output>
        </label>
      </details>

      <details class="control-group">
        <summary>Word Colliders</summary>

        <label class="control-row control-toggle">
          <span>Enable Colliders</span>
          <input type="checkbox" id="word-collider-enabled" checked />
        </label>

        <label class="control-row control-toggle">
          <span>Per-Word Boxes</span>
          <input type="checkbox" id="word-boxes-enabled" checked />
        </label>

        <label class="control-row">
          <span>Padding X (px)</span>
          <input type="range" min="-100" max="100" step="1" value="0" id="word-inset-x" />
          <output id="word-inset-x-out">0</output>
        </label>

        <label class="control-row">
          <span>Padding Y (px)</span>
          <input type="range" min="-100" max="100" step="1" value="0" id="word-inset-y" />
          <output id="word-inset-y-out">0</output>
        </label>

        <label class="control-row">
          <span>Offset X (px)</span>
          <input type="range" min="-100" max="100" step="1" value="0" id="word-offset-x" />
          <output id="word-offset-x-out">0</output>
        </label>

        <label class="control-row">
          <span>Offset Y (px)</span>
          <input type="range" min="-100" max="100" step="1" value="0" id="word-offset-y" />
          <output id="word-offset-y-out">0</output>
        </label>
      </details>

      <details class="control-group">
        <summary>Reset</summary>

        <div class="control-row">
          <span>Clear saved control cache and restore baked defaults.</span>
          <button type="button" id="reset-controls-button">Reset Defaults</button>
        </div>
      </details>
      </details>
    </aside>
    <button id="simulation-pause-toggle" type="button" aria-pressed="false" title="Pause simulation">
      <span class="pause-icon" aria-hidden="true"></span>
      <span class="pause-label">Pause</span>
    </button>
